{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="ui-panel text-center py-12">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-50 border border-amber-200 text-amber-700 mb-5">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800">{{ t('access_denied_title') }}</h1>
        <p class="text-gray-500 mt-3">{{ t('access_denied_desc') }}</p>
        <div class="flex flex-wrap items-center justify-center gap-3 mt-6">
            <a href="{{ url_for('index') }}" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold transition">{{ t('access_denied_back_home') }}</a>
            <a href="{{ url_for('account_settings') }}" class="ui-badge">{{ t('account') }}</a>
        </div>
    </div>
</div>
{% endblock %}
