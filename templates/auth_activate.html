{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto w-full">
    <div class="ui-panel">
        <div class="page-hero">
            <h1>{{ t('auth_activate_invite') }}</h1>
            <p>{{ t('auth_activate_desc') }}</p>
        </div>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('auth_activation_code') }}</label>
                <input type="text" name="code" value="{{ invite.code if invite else request.args.get('code', '') }}" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('auth_name') }}</label>
                <input type="text" name="name" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('auth_email') }}</label>
                <input type="email" name="email" value="{{ invite.email if invite and invite.email else '' }}" class="w-full border border-gray-300 rounded-xl px-4 py-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('auth_password') }}</label>
                <input type="password" name="password" minlength="8" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-semibold transition">{{ t('auth_activate_invite') }}</button>
        </form>
    </div>
</div>
{% endblock %}
