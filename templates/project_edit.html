{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6 flex items-center gap-3">
        <a href="{{ url_for('project_detail', id=project.id) }}" class="text-gray-500 hover:text-blue-600 transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">{{ t('project_edit') }}</h1>
    </div>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_name') }} *</label>
            <input type="text" name="name" value="{{ project.name }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_client') }}</label>
            <input type="text" name="client_name" value="{{ project.client_name or '' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            {% if not can_manage_project %}
            <p class="text-xs text-gray-500 mt-1">{{ t('project_edit_user_hint') }}</p>
            {% endif %}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('tag_list') }}</label>
            <input type="text" name="tag_text" value="{{ project_tags }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_due_date') }}</label>
                <input type="date" name="due_date" value="{{ project.due_date.strftime('%Y-%m-%d') if project.due_date else '' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_time') }}</label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="number" name="print_hours" value="{{ project.estimated_print_time // 60 }}" min="0"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400 text-xs font-bold">h</div>
                    </div>
                    <div class="relative flex-1">
                        <input type="number" name="print_minutes" value="{{ project.estimated_print_time % 60 }}" min="0" max="59"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400 text-xs font-bold">min</div>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_description') }}</label>
            <p class="text-xs text-gray-500 mb-2">{{ t('markdown_editor_help') }}</p>
            <div x-data='markdownEditor({ defaultMode: "visual", placeholder: "{{ t("project_description") }}" })' class="md-editor-shell">
                <textarea x-ref="source" x-model="value" name="description" class="hidden">{{ project.description or '' }}</textarea>
                <div class="md-editor-toolbar">
                    <div class="md-editor-toolbar-group">
                        <button type="button" class="md-editor-btn" @click="apply('bold')" title="{{ t('markdown_editor_bold') }}"><i class="fa-solid fa-bold"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('italic')" title="{{ t('markdown_editor_italic') }}"><i class="fa-solid fa-italic"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('h2')" title="{{ t('markdown_editor_heading') }}"><i class="fa-solid fa-heading"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('ul')" title="{{ t('markdown_editor_bullets') }}"><i class="fa-solid fa-list-ul"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('ol')" title="{{ t('markdown_editor_numbers') }}"><i class="fa-solid fa-list-ol"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('quote')" title="{{ t('markdown_editor_quote') }}"><i class="fa-solid fa-quote-left"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('code')" title="{{ t('markdown_editor_code') }}"><i class="fa-solid fa-code"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('link')" title="{{ t('markdown_editor_link') }}"><i class="fa-solid fa-link"></i></button>
                        <button type="button" class="md-editor-btn" @click="apply('checkbox')" title="{{ t('markdown_editor_checkbox_title') }}"><i class="fa-regular fa-square-check"></i></button>
                    </div>
                    <div class="md-editor-toolbar-group">
                        <button type="button" class="md-editor-btn" :class="{ 'is-active': mode === 'visual' }" @click="setMode('visual')">{{ t('markdown_editor_visual') }}</button>
                        <button type="button" class="md-editor-btn" :class="{ 'is-active': mode === 'markdown' }" @click="setMode('markdown')">{{ t('markdown_editor_markdown') }}</button>
                        <button type="button" class="md-editor-btn" :class="{ 'is-active': mode === 'preview' }" @click="setMode('preview')">{{ t('markdown_editor_preview') }}</button>
                    </div>
                </div>
                <div class="md-editor-surface">
                    <div x-show="mode === 'visual'" x-cloak x-ref="visual" contenteditable="true" class="md-editor-visual" :style="{ minHeight: editorHeight + 'px' }" :data-placeholder="placeholder" @input="syncFromVisual()"></div>
                    <textarea x-show="mode === 'markdown'" x-cloak x-ref="markdown" x-model="value" class="md-editor-input font-mono text-sm" :style="{ minHeight: editorHeight + 'px' }" :placeholder="placeholder"></textarea>
                    <div x-show="mode === 'preview'" x-cloak class="md-editor-preview" :style="{ minHeight: editorHeight + 'px' }" x-html="markdownToHtml(value)"></div>
                </div>
                <div class="md-editor-resizer" @mousedown.prevent="startResize($event)"><div class="md-editor-resizer-line"></div></div>
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
            <a href="{{ url_for('project_detail', id=project.id) }}" class="px-5 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">{{ t('cancel') }}</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg shadow transition flex items-center gap-2">
                <i class="fa-solid fa-save"></i> {{ t('save_changes') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
