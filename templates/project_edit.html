{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6 flex items-center gap-3">
        <a href="{{ url_for('project_detail', id=project.id) }}" class="text-gray-500 hover:text-blue-600 transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">{{ t('project_edit') }}</h1>
    </div>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_name') }} *</label>
            <input type="text" name="name" value="{{ project.name }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_client') }}</label>
            <input type="text" name="client_name" value="{{ project.client_name or '' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_due_date') }}</label>
                <input type="date" name="due_date" value="{{ project.due_date.strftime('%Y-%m-%d') if project.due_date else '' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_time') }}</label>
                <input type="number" name="estimated_print_time" value="{{ project.estimated_print_time }}" min="0" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('project_description') }}</label>
            <textarea name="description" rows="4" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">{{ project.description or '' }}</textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
            <a href="{{ url_for('project_detail', id=project.id) }}" class="px-5 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">{{ t('cancel') }}</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg shadow transition flex items-center gap-2">
                <i class="fa-solid fa-save"></i> {{ t('save_changes') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
