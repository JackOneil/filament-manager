{% extends 'base.html' %}

{% block content %}
<div class="page-shell" id="projects-page" x-data="projectsApp()">
    <div class="page-hero">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div>
                <h1 class="page-title"><span class="page-title-icon"><i class="fa-solid fa-diagram-project"></i></span><span>{{ t('projects') }}</span></h1>
                <p>{{ t('projects_desc') }}</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <a href="{{ url_for('project_create') }}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2 w-fit">
                    <i class="fa-solid fa-plus"></i> {{ t('project_create') }}
                </a>

                <button id="projectsEditBtn" onclick="toggleProjectsEditMode()"
                        class="px-4 py-2 rounded-full text-sm font-semibold border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span id="projectsEditBtnLabel">{{ t('stats_edit_layout') }}</span>
                </button>
            </div>
        </div>
    </div>



    <div id="projectsEditHint" class="hidden bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 flex flex-wrap items-center gap-3 text-sm text-blue-700 mb-4 transition-all duration-300" x-bind:class="editingLayout ? '!flex' : ''">
        <i class="fa-solid fa-arrows-up-down-left-right"></i>
        <span>{{ t('stats_drag_hint') }}</span>
        <button onclick="resetProjectsLayout()" class="ml-auto text-xs font-semibold text-blue-600 hover:text-blue-800 underline">{{ t('stats_reset_layout') }}</button>
    </div>

    <!-- Content wrapper for AJAX reload -->
    <div id="projects-inner-wrapper" class="relative transition-opacity duration-300" :class="loading ? 'opacity-50 pointer-events-none' : 'opacity-100'">
        {% include '_projects_layout.html' %}
    </div>

</div>

<script>
window.initProjectsLayout = function() {
    window.projectsLayout = createWidgetLayoutManager({
        containerId: 'projects-layout',
        scopeId: 'projects-page',
        storageKey: 'projects_layout_v1',
        editButtonId: 'projectsEditBtn',
        labelId: 'projectsEditBtnLabel',
        hintId: 'projectsEditHint',
        editText: {{ t('stats_edit_layout')|tojson }},
        doneText: {{ t('stats_done_editing')|tojson }},
        defaultOrder: ['due_calendar', 'status_new', 'status_printing', 'status_done', 'project_table'],
    });
};
window.initProjectsLayout();

function toggleProjectsEditMode() { 
    window.projectsLayout.toggleEditMode();
    // Communicate state to Alpine if needed
    if (window.__proj) window.__proj.editingLayout = !window.__proj.editingLayout;
}
function moveProjectsWidgetUp(widgetId) { window.projectsLayout.moveUp(widgetId); }
function moveProjectsWidgetDown(widgetId) { window.projectsLayout.moveDown(widgetId); }
function resetProjectsLayout() { window.projectsLayout.reset(); }

function projectsApp() {
    return {
        nameQ: {{ name_filter|default('')|tojson }},
        clientQ: {{ client_filter|default('')|tojson }},
        tagQ: {{ tag_filter|default('')|tojson }},
        page: {{ page|default(1)|tojson }},
        sortBy: {{ sort_by|default('due_date')|tojson }},
        
        statusPages: {
            'PENDING_APPROVAL': 1,
            'APPROVED': 1,
            'PRINTING': 1,
            'DONE': 1,
            'REJECTED': 1
        },
        
        loading: false,
        editingLayout: false,
        
        clientFocus: false,
        tagFocus: false,
        clientOptions: {{ client_options|default([])|tojson }},
        tagOptions: {{ tag_options|default([])|tojson }},

        
        init() {
            window.__proj = this;
            
            // Re-fetch only when a filter changes
            this.$watch('nameQ', () => this.fetchContent());
            this.$watch('clientQ', () => this.fetchContent());
            this.$watch('tagQ', () => this.fetchContent());
            this.$watch('sortBy', () => this.fetchContent());
        },
        
        get hasFilters() {
            return !!(this.nameQ || this.clientQ || this.tagQ);
        },
        
        get filteredClients() {
            if (!this.clientQ) return this.clientOptions;
            let q = this.clientQ.toLowerCase();
            return this.clientOptions.filter(i => i.toLowerCase().includes(q));
        },
        
        get filteredTags() {
            if (!this.tagQ) return this.tagOptions;
            let q = this.tagQ.toLowerCase();
            return this.tagOptions.filter(i => i.toLowerCase().includes(q));
        },
        
        selectClient(val) {
            this.clientQ = val;
            this.clientFocus = false;
        },
        
        selectTag(val) {
            this.tagQ = val;
            this.tagFocus = false;
        },
        
        resetFilters() {
            this.nameQ = '';
            this.clientQ = '';
            this.tagQ = '';
        },
        
        toggleSort(field) {
            this.sortBy = field;
        },
        
        fetchPage(p) {
            if (p) this.page = p;
            this.fetchContent();
        },
        
        fetchStatusContent(status, statusPage) {
            if (status && statusPage) {
                this.statusPages[status] = statusPage;
            }
            this.fetchContent();
        },
        
        async fetchContent() {
            this.loading = true;
            try {
                let params = new URLSearchParams();
                params.append('ajax', '1');
                if (this.nameQ) params.append('name', this.nameQ);
                if (this.clientQ) params.append('client', this.clientQ);
                if (this.tagQ) params.append('tag', this.tagQ);
                if (this.sortBy) params.append('sort_by', this.sortBy);
                if (this.page) params.append('page', this.page);
                
                // Add Kanban pages
                if (this.statusPages['PENDING_APPROVAL'] > 1) params.append('kanban_pending_page', this.statusPages['PENDING_APPROVAL']);
                if (this.statusPages['APPROVED'] > 1) params.append('kanban_approved_page', this.statusPages['APPROVED']);
                if (this.statusPages['PRINTING'] > 1) params.append('kanban_printing_page', this.statusPages['PRINTING']);
                if (this.statusPages['DONE'] > 1) params.append('kanban_done_page', this.statusPages['DONE']);
                if (this.statusPages['REJECTED'] > 1) params.append('kanban_rejected_page', this.statusPages['REJECTED']);

                const res = await fetch(`{{ url_for('projects_index') }}?${params.toString()}`);
                const data = await res.json();
                
                if (data.html) {
                    // Capture focus state before replacement
                    let activeEl = document.activeElement;
                    let focusedId = activeEl ? activeEl.id : null;
                    let cursorPos = activeEl && ('selectionStart' in activeEl) ? activeEl.selectionStart : null;
                    let currentVal = activeEl && ('value' in activeEl) ? activeEl.value : null;

                    const wrapper = document.getElementById('projects-inner-wrapper');
                    wrapper.innerHTML = data.html;
                    
                    // Restore focus and precise value after micro-delay to allow browser/Alpine hydration
                    setTimeout(() => {
                        if (focusedId) {
                            let newEl = document.getElementById(focusedId);
                            if (newEl) {
                                if (currentVal !== null && newEl.value !== currentVal) {
                                    newEl.value = currentVal;
                                }
                                newEl.focus();
                                if (cursorPos !== null && 'setSelectionRange' in newEl) {
                                    try { newEl.setSelectionRange(cursorPos, cursorPos); } catch(e){}
                                }
                            }
                        }
                    }, 10);

                    // Push state
                    let urlParams = new URLSearchParams();
                    if (this.nameQ) urlParams.append('name', this.nameQ);
                    if (this.clientQ) urlParams.append('client', this.clientQ);
                    if (this.tagQ) urlParams.append('tag', this.tagQ);
                    if (this.sortBy) urlParams.append('sort_by', this.sortBy);
                    if (this.page > 1) urlParams.append('page', this.page);
                    const newUrl = `${window.location.pathname}${urlParams.toString() ? '?' + urlParams.toString() : ''}`;
                    window.history.replaceState({path: newUrl}, '', newUrl);
                    
                    window.initProjectsLayout();
                }
            } catch (err) {
                console.error(err);
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
